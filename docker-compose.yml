services:
  specialty:
    build: .
    image: essfta-specialty:1.0.0
    container_name: essfta-specialty
    restart: unless-stopped
    environment:
      SPECIALTY_SECRET_KEY: "${SPECIALTY_SECRET_KEY}"
      SPECIALTY_DB: /data/specialty.db
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      MAIL_FROM: "${MAIL_FROM}"
      SITE_URL: "${SITE_URL}"
    volumes:
      - specialty_data:/data
    networks:
      - npm_npm_network
    ports:
      - "8792:8792"   # direct access over Tailscale for testing before NPM route

volumes:
  specialty_data:

networks:
  npm_npm_network:
    external: true
